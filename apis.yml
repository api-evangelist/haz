aid: haz
name: Haz
description: >-
  Haz (operated by Vend Solutions Ltd) is a London-based AI social commerce
  mobile app that connects friends through the things they own and makes it
  easier to track, buy, and sell second-hand belongings. Its proprietary
  receipt-reading technology scans digital purchase receipts in a user's email
  inbox to automatically digitize owned items in real time, removing the manual
  listing, photography, and description work traditionally required for resale.
  Users get real-time valuations of everything they own and can offer items to
  their social circle in a live feed, increasing the liquidity of everyday goods
  such as clothing and electronics. Haz launched on iOS in March 2024 and raised
  a $1.4M pre-seed round led by Speedinvest. It is a consumer application and does
  not currently publish a public API, developer portal, or SDKs.
